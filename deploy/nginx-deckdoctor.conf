# Deck Doctor — path-hosted at simmander.app/deck-doctor
# ---------------------------------------------------------------------------
# Drop these location blocks INSIDE the existing simmander.app `server { }`
# block (the tracker's nginx config), above its `location / {}` so the more-
# specific /deck-doctor prefixes match first. The tracker is untouched.
#
#   simmander.app/                -> tracker (unchanged)
#   simmander.app/deck-doctor     -> Deck Doctor Next.js server (127.0.0.1:3001)
#   simmander.app/deck-doctor/api -> Deck Doctor FastAPI backend (127.0.0.1:8002)
#
# `^~` is REQUIRED: the tracker has a regex `location ~* \.(png|svg|...)$` that
# would otherwise steal Deck Doctor's hashed static assets. `^~` tells nginx to
# stop at this prefix and skip regex matching. The bare /deck-doctor is proxied
# (NOT redirected) to Next — Next runs basePath=/deck-doctor with trailingSlash
# off, so a redirect to /deck-doctor/ would loop against Next's slash-stripping.

location = /deck-doctor {
    proxy_pass         http://127.0.0.1:3001;     # Next serves /deck-doctor (200)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ^~ /deck-doctor/api/ {
    proxy_pass         http://127.0.0.1:8002/;    # trailing slash strips the prefix
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 60s;
}

location ^~ /deck-doctor/ {
    proxy_pass         http://127.0.0.1:3001;     # no trailing slash: keep /deck-doctor/ in the URI
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 60s;
}
