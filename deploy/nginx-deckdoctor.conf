# Deck Doctor — path-hosted at simmander.app/deck-doctor
# ---------------------------------------------------------------------------
# Drop these location blocks INSIDE the existing simmander.app `server { }`
# block (the tracker's nginx-simmander.conf), above its `location / {}` so the
# more-specific /deck-doctor/ prefixes match first. The tracker is untouched.
#
#   simmander.app/            -> tracker (unchanged)
#   simmander.app/deck-doctor  -> Deck Doctor Next.js server (127.0.0.1:3001)
#   simmander.app/deck-doctor/api/ -> Deck Doctor FastAPI backend (127.0.0.1:8002)
#
# The Next app is built with basePath=/deck-doctor, so it emits and expects
# /deck-doctor-prefixed routes + assets. The API location is matched first and
# proxied straight to FastAPI (the trailing slash on proxy_pass strips the
# /deck-doctor/api/ prefix, so /deck-doctor/api/health -> backend /health).

# Bare /deck-doctor -> /deck-doctor/ (so relative assets resolve).
location = /deck-doctor {
    return 308 /deck-doctor/;
}

location /deck-doctor/api/ {
    proxy_pass         http://127.0.0.1:8002/;   # trailing slash strips the prefix
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_read_timeout 60s;
}

location /deck-doctor/ {
    proxy_pass         http://127.0.0.1:3001;     # no trailing slash: keep /deck-doctor/ in the URI
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Next.js dev/HMR + any future websockets:
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_read_timeout 60s;
}
