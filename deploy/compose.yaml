# Deck Doctor — full stack. Run from the repo root:
#   docker compose -f deploy/compose.yaml up --build
# Postgres holds all app data; the backend reads cards.json from the mounted ../data.
# Load data once after the DB is up:
#   docker compose -f deploy/compose.yaml exec backend python /app/tools/load_to_postgres.py
# (the SQLite artifacts in ../data are the build input the loader mirrors into PG.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deckdoctor
      POSTGRES_PASSWORD: deckdoctor
      POSTGRES_DB: deckdoctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckdoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    volumes:
      - ../data:/app/data:ro            # cards.json + the SQLite build artifacts (loader input)
    environment:
      SIMMANDER_CARDS: /app/data/cards.json
      DATABASE_URL: postgresql://deckdoctor:deckdoctor@db:5432/deckdoctor
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      BACKEND_ORIGIN: http://backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional reverse proxy. Point your DNS (e.g. deck.simmander.app) at this host and
  # uncomment; fill the hostname in deploy/Caddyfile.
  # caddy:
  #   image: caddy:2-alpine
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #   depends_on: [frontend]

volumes:
  pgdata: {}
  # caddy_data: {}
